 const frame=()=>document.getElementById('top100PublicFrame');
 let IDX={products:[],collections:[],language:'id'},pushed=false,lastQuery='',lastScroll=0;
 const TX={id:{ph:'Cari produk atau koleksi…',hint:'Ketik nama produk, harga, atau koleksi.',products:'Produk',collections:'Koleksi',none:q=>`Tidak ada hasil untuk <b>“${q}”</b>.`,all:'Lihat semua koleksi',more:n=>`dan ${n} produk lainnya — ketik lebih spesifik`,count:n=>`${n} produk`,close:'Tutup',fab:'Cari produk'},
           en:{ph:'Search products or collections…',hint:'Type a product name, price, or collection.',products:'Products',collections:'Collections',none:q=>`No results for <b>“${q}”</b>.`,all:'See all collections',more:n=>`and ${n} more — try a more specific term`,count:n=>`${n} products`,close:'Close',fab:'Search products'}};
 const tx=()=>TX[IDX.language==='en'?'en':'id'];
 const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const norm=v=>String(v||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'');
 const digits=v=>String(v||'').replace(/\D/g,'');
 const safeHref=u=>{try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:''}catch(_){return ''}};
 const safeImg=u=>{const s=String(u||'');if(/^\/media\/[A-Za-z0-9_\/.-]+$/.test(s))return s;try{const x=new URL(s,location.href);return ['http:','https:'].includes(x.protocol)?x.href:''}catch(_){return ''}};
 function highlight(text,q){const t=String(text||'');const i=t.toLowerCase().indexOf(q.toLowerCase());if(!q||i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}
 function applyTheme(t){if(!t)return;const map={surface:'--kk-surface',accent:'--kk-accent',onAccent:'--kk-on-accent',ink:'--kk-ink',muted:'--kk-muted',panel:'--kk-panel',line:'--kk-line',soft:'--kk-soft',page:'--kk-page',font:'--kk-font'};const lum=c=>{const m=String(c||'').match(/rgba?\(\s*(\d+)[ ,]+(\d+)[ ,]+(\d+)/);if(m)return (0.2126*m[1]+0.7152*m[2]+0.0722*m[3])/255;const h=String(c||'').match(/^#([0-9a-f]{6})$/i);if(h){const n=parseInt(h[1],16);return (0.2126*(n>>16)+0.7152*((n>>8)&255)+0.0722*(n&255))/255;}return null;};
  const L=lum(t.page);if(L!==null)document.documentElement.style.setProperty('--kk-made-ink',L>0.55?'rgba(15,23,42,.62)':'rgba(255,255,255,.72)');
  for(const k in map){const v=String(t[k]||'').trim();if(v&&v.length<200&&!/[;{}<>]/.test(v)){box.style.setProperty(map[k],v);document.documentElement.style.setProperty(map[k],v);if(k==='ink'||k==='accent')fab.style.setProperty(map[k],v);}}}
 function search(qRaw){
  const q=qRaw.trim();const nq=norm(q),dq=digits(q);
  if(!nq)return {q,products:[],collections:[]};
  const score=p=>{const n=norm(p.name);if(n.startsWith(nq))return 0;if(n.includes(' '+nq))return 1;if(n.includes(nq))return 2;return 3;};
  const products=IDX.products.filter(p=>norm(p.name).includes(nq)||norm(p.desc).includes(nq)||norm(p.price).includes(nq)||(dq.length>=2&&digits(p.price).includes(dq))||(p.collections||[]).some(c=>norm(c).includes(nq)))
   .sort((a,b)=>score(a)-score(b)||(a.order-b.order));
  const collections=IDX.collections.filter(c=>norm(c.name).includes(nq));
  return {q,products,collections};
 }
 function render(){
  const T=tx();const q=input.value;clearBtn.hidden=!q;lastQuery=q;
  if(!q.trim()){body.innerHTML=`<div class="kk-hint">${esc(T.hint)}</div>`;return;}
  const r=search(q);let h='';
  if(r.collections.length){h+=`<div class="kk-group">${esc(T.collections)}</div>`+r.collections.slice(0,6).map(c=>{const img=safeImg(c.image);return `<div class="kk-row" role="button" tabindex="0" data-kk-collection="${esc(c.id)}">${img?`<img class="kk-thumb" src="${esc(img)}" alt="" loading="lazy">`:`<div class="kk-thumb">${esc((c.name||'?').charAt(0).toUpperCase())}</div>`}<div><div class="kk-name">${highlight(c.name,r.q)}</div><div class="kk-sub">${esc(T.count(c.count))}</div></div></div>`}).join('');}
  if(r.products.length){const shown=r.products.slice(0,40);h+=`<div class="kk-group">${esc(T.products)}</div>`+shown.map(p=>{const img=safeImg(p.image),href=safeHref(p.href);const sub=p.desc||(p.collections||[]).join(', ');return `<div class="kk-row" role="button" tabindex="0" data-kk-product="${esc(p.id)}">${img?`<img class="kk-thumb" src="${esc(img)}" alt="" loading="lazy">`:`<div class="kk-thumb">${esc((p.name||'?').charAt(0).toUpperCase())}</div>`}<div style="min-width:0"><div class="kk-name">${highlight(p.name,r.q)}</div>${sub?`<div class="kk-sub">${esc(sub)}</div>`:''}<div class="kk-line">${p.price?`<span class="kk-price">${esc(p.price)}</span>`:''}${href?`<a class="kk-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer sponsored" data-kk-link="${esc(p.id)}">${esc(p.label||'Lihat Produk')} ↗</a>`:''}</div></div></div>`}).join('');
   if(r.products.length>shown.length)h+=`<div class="kk-more">${esc(T.more(r.products.length-shown.length))}</div>`;}
  if(!h)h=`<div class="kk-empty">${T.none(esc(r.q))}<br><button class="kk-allbtn" type="button" data-kk-all>${esc(T.all)}</button></div>`;
  body.innerHTML=h;
 }
 function show(){const T=tx();input.placeholder=T.ph;document.getElementById('kkSearchClose').textContent=T.close;box.classList.add('open');document.documentElement.style.overflow='hidden';if(!pushed){try{history.pushState({kkSearch:1},'');pushed=true}catch(_){}}
  input.value=lastQuery;render();body.scrollTop=lastScroll;setTimeout(()=>{try{input.focus({preventScroll:true})}catch(_){input.focus()}},30);}
 function hideUI(){if(!box.classList.contains('open'))return;lastScroll=body.scrollTop;box.classList.remove('open');document.documentElement.style.overflow='';try{fab.focus({preventScroll:true})}catch(_){}}
 function hide(){const wasPushed=pushed;pushed=false;hideUI();if(wasPushed){try{history.back()}catch(_){}}}
 window.addEventListener('popstate',()=>{if(pushed){pushed=false;hideUI();}});
 function track(type,id,name){try{if(typeof trackEvent==='function')trackEvent(type,String(id),String(name||''));}catch(_){}}
 function openInSite(kind,id){hide();setTimeout(()=>{const f=frame();if(f&&f.contentWindow)f.contentWindow.postMessage({type:'KLIKTIVA_SEARCH_OPEN',kind,id},'*');if(f){const top=f.getBoundingClientRect().top+window.scrollY;window.scrollTo({top:Math.max(0,top-8),behavior:'auto'});}},60);}
 fab.addEventListener('click',show);
 box.addEventListener('click',e=>{
  if(e.target.closest('[data-kk-close]')){hide();return;}
  const a=e.target.closest('a[data-kk-link]');if(a){const p=IDX.products.find(x=>String(x.id)===a.dataset.kkLink);if(p)track('product_click',p.id,p.name);return;}
  if(e.target.closest('[data-kk-all]')){openInSite('collections',null);return;}
  const pr=e.target.closest('[data-kk-product]');if(pr){const p=IDX.products.find(x=>String(x.id)===pr.dataset.kkProduct);if(p){track('product_view',p.id,p.name);openInSite('product',p.id);}return;}
  const co=e.target.closest('[data-kk-collection]');if(co){const c=IDX.collections.find(x=>String(x.id)===co.dataset.kkCollection);if(c){track('collection_view',c.id,c.name);openInSite('collection',c.id);}return;}
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&box.classList.contains('open')){e.preventDefault();hide();}});
 box.addEventListener('keydown',e=>{if(e.key==='Escape')return;if((e.key==='Enter'||e.key===' ')&&e.target.matches('.kk-row')){e.preventDefault();e.target.click();}if(e.key==='Enter'&&e.target===input){input.blur();}});
 input.addEventListener('input',()=>{body.scrollTop=0;render();});
 body.addEventListener('error',e=>{const im=e.target;if(im&&im.tagName==='IMG'&&im.classList.contains('kk-thumb')){const d=document.createElement('div');d.className='kk-thumb';const row=im.closest('.kk-row');const nm=row?(row.querySelector('.kk-name')||{}).textContent||'':'';d.textContent=(nm.trim().charAt(0)||'?').toUpperCase();im.replaceWith(d);}},true);
 clearBtn.addEventListener('click',()=>{input.value='';render();input.focus();});
 window.addEventListener('message',event=>{
  const f=frame();if(!f||event.source!==f.contentWindow||!event.data)return;
  const m=event.data;
  if(m.type==='KLIKTIVA_SEARCH_INDEX'){IDX={products:Array.isArray(m.products)?m.products.slice(0,2000):[],collections:Array.isArray(m.collections)?m.collections.slice(0,500):[],language:m.language==='en'?'en':'id'};applyTheme(m.theme);fab.hidden=!(IDX.products.length||IDX.collections.length);fab.setAttribute('aria-label',tx().fab);if(box.classList.contains('open'))render();}
  else if(m.type==='KLIKTIVA_BACK_TO_SEARCH'){show();}
 });
})();
</script>

</body></html>
